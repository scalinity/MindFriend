# App Review Information
review_info:
  contact_email: review@mindfriend.app
  notes: |
    This app helps users track their mental wellness through:
    1. Daily quests - small wellness tasks
    2. Mood tracking - logging emotional states
    3. AI chat - supportive conversations (not medical advice)
    4. Exercises - breathing and meditation guides
    5. Circles - private groups with friends/family

    The app requires authentication via Apple or Google Sign-In.
    Note: This is a wellness app, not a medical device.

