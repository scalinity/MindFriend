# MindFriend App Store Metadata
# Use this file with fastlane deliver or App Store Connect API

app:
  name: MindFriend
  subtitle: Your AI Wellness Companion
  bundle_id: com.mindfriend.app
  primary_category: Health & Fitness
  secondary_category: Lifestyle

# App Store Description
description:
  en-US: |
    MindFriend is your personal AI wellness companion, designed to help you build better mental health habits through daily quests, mood tracking, and supportive conversations.

    KEY FEATURES:

    Daily Wellness Quests
    Start each day with a personalized micro-task designed to boost your mood and build positive habits. Complete quests to earn XP and maintain your streak.

    AI Chat Support
    Have meaningful conversations with an AI companion that understands and supports your wellness journey. Available 24/7, whenever you need to talk.

    Mood Tracking
    Log your mood, anxiety levels, and energy throughout the day. Visualize your emotional patterns over time to gain insights into your mental health.

    Guided Exercises
    Access a library of breathing exercises, meditations, and grounding techniques to help manage stress and anxiety in the moment.

    Circles
    Connect with friends and family in private support circles. Share check-ins and support each other on your wellness journeys.

    Privacy First
    Your mental health data is yours. Data is encrypted in transit and at rest. Delete your data at any time from Settings. We never sell your data to third parties.

    SUBSCRIPTION OPTIONS:

    MindFriend is free to use with basic features. Premium unlocks unlimited AI conversations, advanced mood analytics, premium guided exercises, and priority support.

    Payment will be charged to your Apple ID account at confirmation of purchase. Subscription automatically renews unless canceled at least 24 hours before the end of the current period.

    Terms of Service: https://mindfriend.app/terms
    Privacy Policy: https://mindfriend.app/privacy

    DISCLAIMER:
    MindFriend is not a replacement for professional mental health care. If you're experiencing a crisis, please contact emergency services or a crisis helpline immediately.

# Keywords (max 100 characters total)
keywords:
  en-US: "mental health,wellness,mood tracker,meditation,anxiety,journal,mindfulness,self-care,therapy,stress"

# What's New (Release Notes)
whats_new:
  en-US: |
    Welcome to MindFriend 1.0!

    - Daily wellness quests to build positive habits
    - AI chat companion for supportive conversations
    - Mood tracking with insights
    - Guided breathing exercises and meditations
    - Circles to connect with friends and family
    - Sign in with Apple and Google

# Promotional Text (can be updated without app update)
promotional_text:
  en-US: "Start your wellness journey today with personalized daily quests and AI-powered support."

# Support Information
