name: CI

# Pull requests run once per commit (as pull_request); pushes run only for main.
on:
  push:
    branches: [main]
  pull_request:

# A new commit on a pull request cancels that PR's superseded run. Runs on main
# are keyed by run id, so they never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ios-tests:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Create build settings from samples
        run: |
          cp apps/ios/Debug.xcconfig.sample apps/ios/Debug.xcconfig
          cp apps/ios/Release.xcconfig.sample apps/ios/Release.xcconfig
      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ["RUNNER_TEMP"], "simulators.json").read_text())
          phones = [device for runtime, devices in data["devices"].items() if ".iOS-" in runtime
                    for device in devices if device["isAvailable"] and device["name"].startswith("iPhone")]
          if not phones:
              raise SystemExit("No available iPhone simulator")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("SIMULATOR_ID=" + phones[0]["udid"] + "\n")
          PY
      # Sentry's binary xcframeworks come from GitHub Releases, which intermittently
      # answers 504. Resolve into the same derived data first, retrying with backoff,
      # so a transient download failure does not fail the test job.
      - name: Resolve Swift packages
        run: |
          for attempt in 1 2 3 4 5; do
            xcodebuild -resolvePackageDependencies \
              -project apps/ios/MindFriendApp.xcodeproj \
              -scheme MindFriendApp \
              -derivedDataPath build && exit 0
            echo "Package resolution failed (attempt $attempt of 5)"
            sleep $((attempt * 20))
          done
          exit 1
      - name: Compile both test bundles and run deterministic regressions
        run: |
          mkdir -p artifacts
          xcodebuild test \
            -project apps/ios/MindFriendApp.xcodeproj \
            -scheme MindFriendApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build \
            -resultBundlePath artifacts/ios-regressions.xcresult \
            -parallel-testing-enabled NO \
            -only-testing:MindFriendAppTests/VaultEncryptionTests \
            -only-testing:MindFriendAppTests/VaultStorageTests \
            -only-testing:MindFriendAppTests/InterventionNotificationManagerTests \
            -only-testing:MindFriendAppTests/AuthUITestIsolationTests \
            -only-testing:MindFriendAppTests/AvatarPersistenceTests \
            -only-testing:MindFriendAppTests/SleepHealthImportRegressionTests \
            -only-testing:MindFriendAppTests/SleepImportPersistenceRegressionTests \
            -only-testing:MindFriendAppTests/FamilyWellnessIntegrationTests/testAgeFilterFlow_ChildAgeChanges_ContentAccessUpdates \
            -only-testing:MindFriendAppTests/CrashReporterTests \
            -only-testing:MindFriendAppTests/CoreCompletionContractTests \
            -only-testing:MindFriendAppUITests/MindFriendAppUITests \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER=
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-regressions
          path: artifacts/ios-regressions.xcresult
          if-no-files-found: ignore

  deno-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      # No --allow-net: unexpected service/provider calls fail the tests.
      - name: Run synthetic handler and accounting regressions
        run: |
          deno test --allow-env --allow-read \
            supabase/tests/issue15_chat_test.ts \
            supabase/tests/monthly-ai-budget.test.ts \
            supabase/tests/family_handlers_test.ts \
            supabase/functions/_shared/sleep-session-records.test.ts \
            supabase/functions/_shared/sleep-session-readers.test.ts \
            supabase/functions/manage-safety-plan/handler.test.ts \
            supabase/functions/delete-account/request-body.test.ts \
            supabase/functions/tests/voice_context_test.ts
      # Synthetic certificate chains are generated with openssl into .cache;
      # OCSP is served by an in-process fixture, so no network is needed.
      - name: Run verify-purchase signature and handler tests
        run: |
          deno test --allow-env --allow-read --allow-write=.cache --allow-run=openssl \
            --config supabase/functions/verify-purchase/deno.test.json \
            supabase/functions/verify-purchase/apple-transaction.test.ts \
            supabase/functions/verify-purchase/test.ts

  sql-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run SQL regressions in a disposable isolated database
        run: python3 supabase/tests/ci/run_sql.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-regressions
          path: artifacts/ci-sql
          if-no-files-found: ignore
