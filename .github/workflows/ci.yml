name: CI

on: [push, pull_request]

jobs:
  # Validate iOS build
  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      # Debug.xcconfig holds real credentials and is gitignored, so CI builds
      # against the committed sample's placeholder values.
      - name: Create build settings from samples
        run: |
          cp apps/ios/Debug.xcconfig.sample apps/ios/Debug.xcconfig
          cp apps/ios/Release.xcconfig.sample apps/ios/Release.xcconfig

      # CI has no signing certificate or provisioning profiles, so compile
      # without signing.
      - name: Build iOS app
        run: |
          xcodebuild build \
            -project apps/ios/MindFriendApp.xcodeproj \
            -scheme MindFriendApp \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  # Basic repo structure checks
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Check repository structure
        run: |
          # Verify key directories exist
          [ -f "supabase/config.toml" ] || (echo "Missing supabase/config.toml" && exit 1)
          [ -d "supabase/functions" ] || (echo "Missing supabase/functions" && exit 1)
          [ -d "supabase/migrations" ] || (echo "Missing supabase/migrations" && exit 1)
          [ -d "apps/ios" ] || (echo "Missing apps/ios" && exit 1)
          echo "✓ Repository structure is valid"
