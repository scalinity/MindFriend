# MindFriend Supabase Configuration
# See: https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "mindfriend://auth/callback"
additional_redirect_urls = ["mindfriend://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# External auth providers are configured in Supabase Dashboard
# [auth.external.apple]
# enabled = true
# client_id = "env(APPLE_CLIENT_ID)"

# [auth.external.google]
# enabled = true
# client_id = "env(GOOGLE_CLIENT_ID)"

[analytics]
enabled = false

# Edge Functions configuration
[functions.chat]
verify_jwt = false  # We handle auth in the function itself
