# MindFriend Supabase Configuration
# See: https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "500MiB"

[auth]
enabled = true
site_url = "mindfriend://auth/callback"
additional_redirect_urls = ["mindfriend://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# External auth providers are configured in Supabase Dashboard
# [auth.external.apple]
# enabled = true
# client_id = "env(APPLE_CLIENT_ID)"

# [auth.external.google]
# enabled = true
# client_id = "env(GOOGLE_CLIENT_ID)"

[analytics]
enabled = false

# Edge Functions configuration
# NOTE: JWT verification is handled internally by each function using supabase.auth.getUser()
# Gateway-level verify_jwt can cause issues with token formats, so we disable it here
# and rely on the internal verification which is more flexible and provides better error messages

[functions.chat]
verify_jwt = false  # Verified internally in function code

[functions.voice-token]
verify_jwt = false  # Verified internally in function code

[functions.b2b-stripe-webhook]
verify_jwt = false

[functions.join-family]
verify_jwt = false

[functions.join-organization]
verify_jwt = false

[functions.validate-invite-code]
verify_jwt = false

[functions.create-organization]
verify_jwt = false

[functions.generate-profile-picture]
verify_jwt = false  # Verified internally in function code

[functions.calculate-capacity]
verify_jwt = false  # Verified internally in function code

