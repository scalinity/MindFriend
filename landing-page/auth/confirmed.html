<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindFriend - Email Confirmed</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/logo.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#6366f1',
            'primary-dark': '#4f46e5',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <style>
    .checkmark {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: block;
      stroke-width: 2;
      stroke: #22c55e;
      stroke-miterlimit: 10;
      animation: fill 0.4s ease-in-out 0.4s forwards, scale 0.3s ease-in-out 0.9s both;
    }
    .checkmark__circle {
      stroke-dasharray: 166;
      stroke-dashoffset: 166;
      stroke-width: 2;
      stroke-miterlimit: 10;
      stroke: #22c55e;
      fill: none;
      animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
    }
    .checkmark__check {
      transform-origin: 50% 50%;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
    }
    @keyframes stroke {
      100% { stroke-dashoffset: 0; }
    }
    @keyframes scale {
      0%, 100% { transform: none; }
      50% { transform: scale3d(1.1, 1.1, 1); }
    }
    @keyframes fill {
      100% { box-shadow: inset 0px 0px 0px 40px rgba(34, 197, 94, 0.1); }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-6">

  <div class="max-w-md mx-auto text-center">
    <!-- Success Checkmark -->
    <svg class="checkmark mx-auto mb-8" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
      <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
      <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
    </svg>

    <!-- Content -->
    <img src="/assets/logo.png" alt="MindFriend" class="w-16 h-16 mx-auto mb-4">
    <h1 class="text-2xl font-bold text-gray-900 mb-3">Email Confirmed!</h1>
    <p class="text-gray-600 mb-8">
      Your email has been verified successfully.<br>
      You can now open the MindFriend app to continue.
    </p>

    <!-- Deep Link Button -->
    <a
      href="mindfriend://auth/callback"
      class="inline-block px-8 py-4 bg-primary hover:bg-primary-dark text-white font-semibold rounded-xl transition-all transform hover:scale-[1.02] active:scale-[0.98] mb-4"
    >
      Open MindFriend App
    </a>

    <p class="text-sm text-gray-500">
      Don't have the app yet?
      <a href="/" class="text-primary hover:underline">Learn more</a>
    </p>
  </div>

</body>
</html>
