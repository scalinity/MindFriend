<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindFriend - Reset Password</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/logo.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#6366f1',
            'primary-dark': '#4f46e5',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .strength-bar {
      height: 4px;
      border-radius: 2px;
      background: #e5e7eb;
      overflow: hidden;
    }
    .strength-bar-fill {
      height: 100%;
      transition: width 0.3s ease, background-color 0.3s ease;
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-6 py-12">

  <div class="max-w-md w-full mx-auto">
    <!-- Header -->
    <div class="text-center mb-8">
      <img src="/assets/logo.png" alt="MindFriend" class="w-16 h-16 mx-auto mb-4">
      <h1 class="text-2xl font-bold text-gray-900 mb-2">Reset Your Password</h1>
      <p class="text-gray-600">Enter your new password below.</p>
    </div>

    <!-- Form -->
    <form id="reset-form" class="bg-white rounded-2xl p-8 shadow-sm">
      <!-- New Password -->
      <div class="mb-4">
        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">New Password</label>
        <input
          type="password"
          id="password"
          required
          minlength="8"
          placeholder="Enter new password"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all"
        >
        <!-- Password Strength -->
        <div class="mt-2">
          <div class="strength-bar">
            <div id="strength-fill" class="strength-bar-fill" style="width: 0%"></div>
          </div>
          <p id="strength-text" class="text-xs text-gray-500 mt-1"></p>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="mb-6">
        <label for="confirm-password" class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
        <input
          type="password"
          id="confirm-password"
          required
          minlength="8"
          placeholder="Confirm new password"
          class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all"
        >
        <p id="match-error" class="text-xs text-red-600 mt-1 hidden">Passwords do not match</p>
      </div>

      <!-- Error/Success Message -->
      <div id="message" class="mb-4 p-4 rounded-xl hidden"></div>

      <!-- Submit Button -->
      <button
        type="submit"
        id="submit-btn"
        class="w-full px-6 py-4 bg-primary hover:bg-primary-dark text-white font-semibold rounded-xl transition-all transform hover:scale-[1.02] active:scale-[0.98]"
      >
        Update Password
      </button>
    </form>

    <!-- Success State (hidden by default) -->
    <div id="success-state" class="hidden text-center">
      <svg class="w-20 h-20 mx-auto mb-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
      <h2 class="text-2xl font-bold text-gray-900 mb-3">Password Updated!</h2>
      <p class="text-gray-600 mb-8">
        Your password has been reset successfully.<br>
        You can now sign in with your new password.
      </p>
      <a
        href="mindfriend://auth/callback"
        class="inline-block px-8 py-4 bg-primary hover:bg-primary-dark text-white font-semibold rounded-xl transition-all"
      >
        Open MindFriend App
      </a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://YOUR_PROJECT_REF.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpmYXVjaXZ0emZ3bnJpanNiZnVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgyNTI2NDgsImV4cCI6MjA4MzgyODY0OH0.tZaiIYvZKLUZFoNl2nvfRbOj8lodtY7Kw7BiQyoK2Rk';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('reset-form');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm-password');
    const strengthFill = document.getElementById('strength-fill');
    const strengthText = document.getElementById('strength-text');
    const matchError = document.getElementById('match-error');
    const messageEl = document.getElementById('message');
    const submitBtn = document.getElementById('submit-btn');
    const successState = document.getElementById('success-state');

    // Initialize session from stored tokens
    async function initSession() {
      const accessToken = sessionStorage.getItem('recovery_access_token');
      const refreshToken = sessionStorage.getItem('recovery_refresh_token');

      if (accessToken) {
        try {
          await supabase.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken || ''
          });
        } catch (error) {
          console.error('Failed to restore session:', error);
        }
      }
    }

    // Password strength checker
    function checkPasswordStrength(password) {
      let strength = 0;
      if (password.length >= 8) strength++;
      if (password.length >= 12) strength++;
      if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
      if (/\d/.test(password)) strength++;
      if (/[^a-zA-Z0-9]/.test(password)) strength++;

      return Math.min(strength, 3); // 1-3 scale
    }

    passwordInput.addEventListener('input', () => {
      const password = passwordInput.value;
      const strength = checkPasswordStrength(password);

      if (password.length === 0) {
        strengthFill.style.width = '0%';
        strengthFill.style.backgroundColor = '#e5e7eb';
        strengthText.textContent = '';
        return;
      }

      if (strength === 1) {
        strengthFill.style.width = '33%';
        strengthFill.style.backgroundColor = '#ef4444';
        strengthText.textContent = 'Weak password';
        strengthText.className = 'text-xs text-red-600 mt-1';
      } else if (strength === 2) {
        strengthFill.style.width = '66%';
        strengthFill.style.backgroundColor = '#f59e0b';
        strengthText.textContent = 'Medium strength';
        strengthText.className = 'text-xs text-amber-600 mt-1';
      } else {
        strengthFill.style.width = '100%';
        strengthFill.style.backgroundColor = '#22c55e';
        strengthText.textContent = 'Strong password';
        strengthText.className = 'text-xs text-green-600 mt-1';
      }
    });

    confirmInput.addEventListener('input', () => {
      if (confirmInput.value && confirmInput.value !== passwordInput.value) {
        matchError.classList.remove('hidden');
        confirmInput.classList.add('border-red-300');
      } else {
        matchError.classList.add('hidden');
        confirmInput.classList.remove('border-red-300');
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = passwordInput.value;
      const confirmPassword = confirmInput.value;

      // Validation
      if (password !== confirmPassword) {
        matchError.classList.remove('hidden');
        confirmInput.classList.add('border-red-300');
        return;
      }

      if (password.length < 8) {
        showMessage('Password must be at least 8 characters', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';

      try {
        const { data, error } = await supabase.auth.updateUser({
          password: password
        });

        if (error) throw error;

        // Clear stored tokens
        sessionStorage.removeItem('recovery_access_token');
        sessionStorage.removeItem('recovery_refresh_token');

        // Show success state
        form.classList.add('hidden');
        successState.classList.remove('hidden');

      } catch (error) {
        console.error('Password reset error:', error);
        showMessage(error.message || 'Failed to reset password. Please try again.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
      }
    });

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.classList.remove('hidden', 'bg-green-50', 'text-green-700', 'bg-red-50', 'text-red-700');

      if (type === 'error') {
        messageEl.classList.add('bg-red-50', 'text-red-700');
      } else {
        messageEl.classList.add('bg-green-50', 'text-green-700');
      }
    }

    // Initialize on page load
    initSession();
  </script>

</body>
</html>
